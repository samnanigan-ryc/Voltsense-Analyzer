name: Build VoltSense APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Audit, Test and Build VoltSense APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # ============================================================
      # PROJECT STRUCTURE AUDIT
      # ============================================================

      - name: Inspect Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VoltSense Android Project"
          echo "======================================"

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "app/build.gradle.kts"
          test -f "app/src/main/AndroidManifest.xml"

          echo
          echo "Required Android project files found."
          echo "PROJECT STRUCTURE PASSED"


      # ============================================================
      # GENERATE GRADLE WRAPPER
      # ============================================================

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Generating Gradle wrapper"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

          test -f "./gradlew"
          test -f "./gradle/wrapper/gradle-wrapper.jar"
          test -f "./gradle/wrapper/gradle-wrapper.properties"

          chmod +x ./gradlew

          ./gradlew --version

          echo "GRADLE WRAPPER PASSED"


      # ============================================================
      # GOOGLE SERVICES
      # ============================================================

      - name: Create matching CI Google Services configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Preparing Google Services"
          echo "======================================"

          APP_GRADLE="app/build.gradle.kts"

          PACKAGE_NAME="$(
            sed -nE \
              's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              "$APP_GRADLE" \
              | head -n 1
          )"

          if [[ -z "$PACKAGE_NAME" ]]; then
            PACKAGE_NAME="$(
              sed -nE \
                's/^[[:space:]]*namespace[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
                "$APP_GRADLE" \
                | head -n 1
            )"
          fi

          if [[ -z "$PACKAGE_NAME" ]]; then
            echo "ERROR: Could not determine Android package name."
            exit 1
          fi

          echo "Detected package:"
          echo "$PACKAGE_NAME"

          # Always create a CI-local configuration.
          # This prevents an incompatible repository copy from
          # causing a Google Services package mismatch.

          rm -f "app/google-services.json"

          cat > "app/google-services.json" <<EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "voltsense-ci",
              "storage_bucket": "voltsense-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "$PACKAGE_NAME"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "CI_BUILD_ONLY"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

          test -s "app/google-services.json"

          echo "Google Services configuration created."
          echo "GOOGLE SERVICES PREPARATION PASSED"


      # ============================================================
      # VERIFY GOOGLE SERVICES
      # ============================================================

      - name: Verify Google Services package
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="app/build.gradle.kts"

          PACKAGE_NAME="$(
            sed -nE \
              's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              "$APP_GRADLE" \
              | head -n 1
          )"

          if [[ -z "$PACKAGE_NAME" ]]; then
            PACKAGE_NAME="$(
              sed -nE \
                's/^[[:space:]]*namespace[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
                "$APP_GRADLE" \
                | head -n 1
            )"
          fi

          python3 - "$PACKAGE_NAME" <<'PY'
          import json
          import sys

          expected = sys.argv[1]

          with open(
              "app/google-services.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          clients = data.get("client", [])

          matches = [
              client
              for client in clients
              if client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name") == expected
          ]

          if not matches:
              print(
                  "ERROR: google-services.json does not contain "
                  f"a client for {expected}"
              )
              sys.exit(1)

          print(
              "Google Services package matches:"
              f" {expected}"
          )
          PY

          echo "GOOGLE SERVICES VERIFICATION PASSED"


      # ============================================================
      # STATIC AUDIT
      # ============================================================

      - name: Static project audit
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VoltSense Static Audit"
          echo "======================================"

          test -f "./gradlew"
          test -f "./gradle/wrapper/gradle-wrapper.jar"
          test -f "./gradle/wrapper/gradle-wrapper.properties"

          test -f "./settings.gradle.kts"
          test -f "./build.gradle.kts"
          test -f "./app/build.gradle.kts"
          test -f "./app/src/main/AndroidManifest.xml"
          test -f "./app/google-services.json"

          SOURCE_COUNT="$(
            find app/src/main \
              -type f \
              \( \
                -name "*.kt" \
                -o -name "*.java" \
              \) \
              | wc -l
          )"

          if [[ "$SOURCE_COUNT" -eq 0 ]]; then
            echo "ERROR: No Android source files found."
            exit 1
          fi

          echo "Android source files: $SOURCE_COUNT"

          echo
          echo "Checking application source for hard-coded secrets..."

          SECRET_FOUND=0

          while IFS= read -r -d '' FILE; do

            if grep -nE \
              'AIza[0-9A-Za-z_-]{20,}|BEGIN PRIVATE KEY|sk-[A-Za-z0-9]{20,}' \
              "$FILE" >/dev/null 2>&1; then

              echo "Possible secret found in:"
              echo "$FILE"

              SECRET_FOUND=1
            fi

          done < <(
            find app/src/main \
              -type f \
              \( \
                -name "*.kt" \
                -o -name "*.java" \
                -o -name "*.properties" \
                -o -name "*.json" \
              \) \
              -print0
          )

          if [[ "$SECRET_FOUND" -ne 0 ]]; then
            echo "ERROR: Possible hard-coded application secret detected."
            exit 1
          fi

          echo
          echo "STATIC AUDIT PASSED"


      # ============================================================
      # GRADLE VALIDATION
      # ============================================================

      - name: Validate Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            tasks

          echo "GRADLE CONFIGURATION PASSED"


      # ============================================================
      # PRODUCTION COMPILATION
      # ============================================================

      - name: Compile production Kotlin
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugKotlin

          echo "PRODUCTION KOTLIN COMPILATION PASSED"


      # ============================================================
      # LINT
      # ============================================================

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            lintDebug

          echo "ANDROID LINT PASSED"


      # ============================================================
      # DEBUG KEYSTORE
      # ============================================================

      - name: Prepare CI debug keystore
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Preparing debug keystore"
          echo "======================================"

          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"

          if [[ -f "$KEYSTORE" ]]; then
            echo "Existing debug.keystore found."
          else
            echo "Generating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "Debug keystore generated."
          fi

          test -f "$KEYSTORE"

          echo
          echo "Verifying debug keystore..."

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey

          echo
          echo "DEBUG KEYSTORE PASSED"


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Building VoltSense APK"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

          echo "GRADLE APK BUILD PASSED"


      # ============================================================
      # APK VALIDATION
      # ============================================================

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Searching for generated APK..."

          find app/build \
            -type f \
            -name "*.apk" \
            -print

          if [[ ! -f "$APK" ]]; then
            echo "ERROR: app-debug.apk was not generated."
            exit 1
          fi

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: Generated APK is empty."
            exit 1
          fi

          echo
          echo "APK successfully generated:"
          ls -lh "$APK"

          echo
          echo "APK FILE CHECK PASSED"


      # ============================================================
      # APK SIGNATURE VALIDATION
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$APKSIGNER" ]]; then
            echo "ERROR: Android apksigner was not found."
            exit 1
          fi

          echo "Using:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          echo
          echo "APK SIGNATURE VERIFICATION PASSED"


      # ============================================================
      # APK ZIP VALIDATION
      # ============================================================

      - name: Validate APK archive
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK archive integrity..."

          unzip -t "$APK" >/dev/null

          echo "APK ARCHIVE INTEGRITY PASSED"


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltSense-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
