name: Build VoltSense APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Audit, Test and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The uploaded repository does not contain gradlew.
      # Install Gradle only for bootstrapping the wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Inspect project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Project structure"
          echo "======================================"

          find . \
            -path "./.git" -prune -o \
            -path "./.gradle" -prune -o \
            -path "./app/build" -prune -o \
            -type f -print \
            | sort \
            | head -500

          echo
          echo "Gradle project:"
          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "app/build.gradle.kts"

          echo "PASS"

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating Gradle wrapper..."

          gradle \
            --no-daemon \
            --stacktrace \
            wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

          test -f "./gradlew"
          test -f "./gradle/wrapper/gradle-wrapper.jar"
          test -f "./gradle/wrapper/gradle-wrapper.properties"

          chmod +x ./gradlew

          echo
          echo "Gradle wrapper successfully generated:"
          ./gradlew --version

      - name: Static project audit
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VoltSense Static Audit"
          echo "======================================"

          test -f "./gradlew"
          test -f "./settings.gradle.kts"
          test -f "./build.gradle.kts"
          test -f "./app/build.gradle.kts"
          test -f "./app/src/main/AndroidManifest.xml"

          SOURCE_COUNT=$(
            find app/src/main \
              -type f \
              \( -name "*.kt" -o -name "*.java" \) \
              | wc -l
          )

          if [[ "$SOURCE_COUNT" -eq 0 ]]; then
            echo "ERROR: No Kotlin/Java source files found."
            exit 1
          fi

          echo "Source files: $SOURCE_COUNT"

          if find . \
            -path "./.git" -prune -o \
            -path "./.gradle" -prune -o \
            -path "./build" -prune -o \
            -path "./app/build" -prune -o \
            -name "local.properties" \
            -print | grep -q .; then

            echo "ERROR: local.properties detected."
            exit 1
          fi

          if grep -RInE \
            --exclude-dir=".git" \
            --exclude-dir=".gradle" \
            --exclude-dir="build" \
            --exclude="*.png" \
            --exclude="*.jpg" \
            --exclude="*.jpeg" \
            --exclude="*.webp" \
            'AIza[0-9A-Za-z_-]{20,}|BEGIN PRIVATE KEY|sk-[A-Za-z0-9]{20,}' \
            .; then

            echo "ERROR: Possible hard-coded secret detected."
            exit 1
          fi

          echo
          echo "STATIC AUDIT PASSED"

      - name: Validate Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            tasks

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            lintDebug

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated APK files:"

          find app/build \
            -type f \
            -name "*.apk" \
            -print

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo
            echo "ERROR: Expected APK was not generated."
            exit 1
          fi

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo
          echo "APK:"
          ls -lh "$APK"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$APKSIGNER" ]]; then
            echo "ERROR: Android apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo
          echo "APK SIGNATURE VERIFICATION PASSED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltSense-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
