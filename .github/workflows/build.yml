name: Build VoltSense APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Audit and Build VoltSense APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Inspect Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VoltSense Android Project"
          echo "======================================"

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "app/build.gradle.kts"
          test -f "app/src/main/AndroidManifest.xml"

          echo "Project structure OK."

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

          test -f "./gradlew"
          test -f "./gradle/wrapper/gradle-wrapper.jar"
          test -f "./gradle/wrapper/gradle-wrapper.properties"

          chmod +x ./gradlew

          ./gradlew --version

      - name: Prepare CI-only Google Services configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Google Services configuration..."

          if [[ -f "app/google-services.json" ]]; then
            echo "Existing google-services.json found."
            exit 0
          fi

          PACKAGE_NAME="$(
            grep -oE 'namespace[[:space:]]*=[[:space:]]*"[^"]+"' \
              app/build.gradle.kts \
              | head -n 1 \
              | sed -E 's/.*"([^"]+)".*/\1/'
          )"

          if [[ -z "${PACKAGE_NAME}" ]]; then
            PACKAGE_NAME="$(
              grep -oE 'applicationId[[:space:]]*=[[:space:]]*"[^"]+"' \
                app/build.gradle.kts \
                | head -n 1 \
                | sed -E 's/.*"([^"]+)".*/\1/'
            )"
          fi

          if [[ -z "${PACKAGE_NAME}" ]]; then
            echo "ERROR: Could not determine Android package name."
            exit 1
          fi

          echo "Detected package: ${PACKAGE_NAME}"

          cat > app/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "voltsense-ci",
              "storage_bucket": "voltsense-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "${PACKAGE_NAME}"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "CI_BUILD_ONLY"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

          test -s app/google-services.json

          echo "CI-only Google Services configuration created."

      - name: Static audit
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VoltSense Static Audit"
          echo "======================================"

          test -f "./gradlew"
          test -f "./gradle/wrapper/gradle-wrapper.jar"
          test -f "./settings.gradle.kts"
          test -f "./build.gradle.kts"
          test -f "./app/build.gradle.kts"
          test -f "./app/src/main/AndroidManifest.xml"
          test -f "./app/google-services.json"

          SOURCE_COUNT="$(
            find app/src/main \
              -type f \
              \( -name "*.kt" -o -name "*.java" \) \
              | wc -l
          )"

          if [[ "${SOURCE_COUNT}" -eq 0 ]]; then
            echo "ERROR: No Android source files found."
            exit 1
          fi

          echo "Android source files: ${SOURCE_COUNT}"

          echo "Checking application source for actual hard-coded secrets..."

          SECRET_FOUND=0

          while IFS= read -r -d '' FILE; do
            if grep -nE \
              'AIza[0-9A-Za-z_-]{20,}|BEGIN PRIVATE KEY|sk-[A-Za-z0-9]{20,}' \
              "${FILE}" >/dev/null 2>&1; then

              echo "Possible secret found in: ${FILE}"
              SECRET_FOUND=1
            fi
          done < <(
            find app/src/main \
              -type f \
              \( \
                -name "*.kt" \
                -o -name "*.java" \
                -o -name "*.properties" \
                -o -name "*.json" \
                \) \
              -print0
          )

          if [[ "${SECRET_FOUND}" -ne 0 ]]; then
            echo "ERROR: Possible hard-coded application secret detected."
            exit 1
          fi

          echo "STATIC AUDIT PASSED"

      - name: Validate Gradle
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            tasks

      # The repository currently contains GreetingScreenshotTest.kt,
      # which references a nonexistent Greeting symbol.
      # It is deliberately NOT executed because this workflow's
      # acceptance target is APK compilation.
      - name: Verify production Kotlin compilation
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugKotlin

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            lintDebug

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Generated APK files:"
          find app/build \
            -type f \
            -name "*.apk" \
            -print

          if [[ ! -f "${APK}" ]]; then
            echo "ERROR: app-debug.apk was not generated."
            exit 1
          fi

          if [[ ! -s "${APK}" ]]; then
            echo "ERROR: Generated APK is empty."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "${APK}"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER="$(
            find "${ANDROID_HOME}/build-tools" \
              -type f \
              -name "apksigner" \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "${APKSIGNER}" ]]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "${APKSIGNER}" verify --verbose "${APK}"

          echo "APK SIGNATURE VERIFICATION PASSED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltSense-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
